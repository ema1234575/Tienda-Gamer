<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="página de venta de videojuegos y consolas">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="img/gamepad-solid.png">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Iniciar sesión - Tienda Gamer</title>
</head>

<body>
    <header class="header-container">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html" title="Tienda Gamer">
                    <img src="img/logo_tienda_gamer.png" alt="logo tienda gamer">
                </a>
            </div>

            <ul>
                <li><a href="index.html" title="Inicio">Inicio</a></li>
                <li><a href="#" title="consolas">Consolas</a></li>
                <li><a href="#" title="videojuegos">Videojuegos</a></li>
            </ul>
            <div class="icons">
                <a href="login.html" title="Iniciar Sesión">
                    <span class="material-symbols-outlined">account_circle</span></a>
                <a href="#" title="Carrito">
                    <span class="material-symbols-outlined">shopping_cart</span></a>
                <a href="contacto.html" title="Contacto">
                    <span class="material-symbols-outlined">info</span></a>
            </div>
        </nav>
        <hr>
    </header>

    <main>

        <div id="form-container">

            <form onsubmit=" return inicioSesion()">
                <h2>Iniciar Sesión</h2>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
                <label for="key">Contraseña</label>
                <input type="text" id="contraseña" name="contraseña" required>
                <input class="boton_comprar" type="submit" value="Ingresar">
                <p style="color:blue; cursor:pointer">¿Olvidaste tu contraseña?</p>
            </form>

            <div class="crear-cuenta">
                <h3>¿No tienes una cuenta?</h3>
                <button class="boton_comprar" type="button">Crear cuenta</button>
            </div>

        </div>

    </main>

    <footer>
        <div class="footer-pagos">
            <p>Medios de pago aceptados:</p>
            <div class="footer-iconos-pago">
                <span class="fa-brands fa-cc-visa" title=" Visa"></span>
                <span class="fa-brands fa-cc-mastercard" title=" Mastercard"></span>
                <span class="fa-brands fa-cc-amex" title=" American Express"></span>
                <span class="fa-brands fa-cc-paypal" title=" PayPal"></span>
            </div>
        </div>
        <div class="footer-copyright">
            <p>© 2026 Tienda Gamer. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>

<script>

    function inicioSesion() {
        var email = document.getElementById('email').value;
        var contraseña = document.getElementById('contraseña').value;

        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert('Por favor, introduzca una dirección de correo electrónico válida.');
            return false;
        }

        alert('Inicio de sesion exitoso');
        return true;
    }

</script>

</html>
